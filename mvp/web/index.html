<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VCB Video Agent · Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap&subset=vietnamese" rel="stylesheet">
<link rel="stylesheet" href="/web/editor-layout.css">
<link rel="stylesheet" href="/web/editor-panels.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">V</span>VCB Video Agent</div>
  <nav class="tabs">
    <button class="tab active" data-tab="studio">Studio dựng video</button>
    <button class="tab" data-tab="models">So sánh model AI</button>
  </nav>
  <div id="project-title" class="project-title">Dự án mới</div>
  <div id="env-chip" class="chip">…</div>
  <div class="export-wrap">
    <button id="export-btn" class="export-btn" disabled>⤓ Xuất</button>
    <div id="export-menu" class="export-menu hidden"></div>
  </div>
</header>

<main id="tab-studio" class="editor">
  <section class="pane library">
    <nav id="lib-tabs" class="lib-tabs"></nav>
    <div id="lib-body" class="lib-body"></div>
  </section>

  <section class="pane player-pane">
    <div class="pane-head"><span>Trình phát</span><span id="render-meta" class="muted"></span></div>
    <div class="player-stage">
      <div class="player-wrap">
        <video id="player" playsinline preload="auto"></video>
        <div id="render-overlay" class="overlay hidden"></div>
        <div id="empty-state" class="overlay"><span>Chọn kịch bản ở tab <b>Kịch bản</b> rồi bấm <b>Dựng video</b></span></div>
      </div>
    </div>
    <div class="player-bar">
      <span id="timecode" class="mono">00:00.0 / 00:00.0</span>
      <button id="play-btn" class="icon-btn play" title="Phát / dừng (Space)">▶</button>
      <div class="bar-right"><span class="chip">9:16 · 1080×1920</span>
        <button id="fullscreen-btn" class="icon-btn" title="Toàn màn hình">⛶</button></div>
    </div>
  </section>

  <section class="pane inspector">
    <nav id="insp-tabs" class="insp-tabs"></nav>
    <div id="inspector" class="insp-body"><p class="muted pad">Chọn một khối trên timeline để chỉnh.</p></div>
  </section>

  <section class="pane timeline-pane">
    <div class="tl-toolbar">
      <button id="undo-btn" class="tool-btn" title="Hoàn tác (Ctrl/⌘+Z)" disabled>↶ Hoàn tác</button>
      <span class="tool-sep"></span>
      <span id="busy-chip" class="busy hidden"></span>
      <span class="spacer"></span>
      <div class="legend">
        <span><i class="sw real"></i>Footage VCB</span><span><i class="sw collected"></i>Sưu tầm</span>
        <span><i class="sw gen"></i>AI generate</span><span><i class="sw missing"></i>⚠ Thiếu</span>
      </div>
      <span class="tool-sep"></span>
      <label class="zoom">🔍 <input id="tl-zoom" type="range" min="1" max="4" step="0.25" value="1"></label>
    </div>
    <div id="timeline" class="timeline"></div>
  </section>
</main>

<main id="tab-models" class="models hidden"></main>

<script type="module" src="/web/js/studio-app.js"></script>
</body>
</html>
